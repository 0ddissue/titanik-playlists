<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Музыкальный Брелок</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    <style>
        body { background: #121212; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; }
        /* Кассета */
        .cassette { width: 100%; height: 180px; background: #1e1e1e; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        .cassette img { width: 90%; height: 90%; object-fit: contain; }
        /* Инфо */
        .track-info { text-align: center; margin-bottom: 20px; }
        .track-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .artist-name { font-size: 14px; color: #888; }
        /* Кнопка купить */
        .btn-buy { width: 100%; padding: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; text-decoration: none; display: block; }
        /* APlayer стилизация */
        .aplayer { background: #121212 !important; border: none !important; }
        .aplayer .aplayer-list ol li { border-top: 1px solid #222; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cassette">
            <!-- Сюда вставьте ссылку на ВАШУ картинку кассеты -->
            <img src="https://via.placeholder.com/400x150?text=ЗДЕСЬ+БУДЕТ+ВАША+КАССЕТА" alt="Кассета">
        </div>

        <div class="track-info">
            <div class="track-name" id="track-name">Выберите трек</div>
            <div class="artist-name" id="artist-name">Нажмите PLAY</div>
        </div>

        <a href="/catalog" class="btn-buy">ПРИОБРЕСТИ ЕЩЁ СБОРНИКИ</a>

        <div id="aplayer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <script>
        const ap = new APlayer({
            container: document.getElementById('aplayer'),
            audio: [ /* ВСТАВИТЬ ВАШ СПИСОК */ ],
            theme: '#ff5722' // Оранжевый цвет
        });
        
        ap.on('play', function () {
            document.getElementById('track-name').innerText = ap.list.audios[ap.list.index].name;
            document.getElementById('artist-name').innerText = ap.list.audios[ap.list.index].artist;
        });
    </script>
</body>
</html>
