<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Золотой Русский Шансон</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .cover-container { width: 200px; height: 200px; margin: 0 auto 20px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(255,255,255,0.1); }
        .cover-container img { width: 100%; height: 100%; object-fit: cover; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-play { background: #fff; color: #000; }
        .btn-search { background: #333; color: #fff; }
        #aplayer { background: #1c1c1e; border-radius: 15px; }
        .footer-btn { display: block; width: 100%; padding: 15px; margin-top: 30px; background: #1c1c1e; border: 1px solid #333; color: #ffd700; text-align: center; border-radius: 12px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Золотой Русский Шансон</h1>
        <div class="cover-container">
            <img src="https://archive.org/download/y_373_201805/CD-MP3-russisch-200---.jpg" alt="Обложка">
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-play" onclick="ap.play()">Слушать</button>
        <button class="btn btn-search" onclick="document.querySelector('.aplayer-list').classList.toggle('show-search')">🔍 Поиск</button>
    </div>

    <div id="aplayer"></div>

    <a href="/catalog" class="footer-btn">Другие плейлисты (Скидка!)</a>

    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <script>
        const ap = new APlayer({
            container: document.getElementById('aplayer'),
            audio: [ /* ВСТАВИТЬ СПИСОК СЮДА */ ]
        });
    </script>
</body>
</html>
