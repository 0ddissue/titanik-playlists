.-.mp3"}];
  const audio = document.getElementById('audio');
  const listEl = document.getElementById('list');
  const nameEl = document.getElementById('name');
  const artistEl = document.getElementById('artist');
  const icon = document.getElementById('icon');
  const PLAY_PATH = "M8 5v14l11-7z";
  const PAUSE_PATH = "M6 5h4v14H6zM14 5h4v14h-4z";
  let index = 0;

  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="t"></span><span class="a"></span>';
    li.querySelector('.t').textContent = t.name;
    li.querySelector('.a').textContent = t.artist;
    li.addEventListener('click', () => load(i, true));
    listEl.appendChild(li);
  });

  function highlight() {
    [...listEl.children].forEach((li, i) => li.classList.toggle('active', i === index));
    const active = listEl.children[index];
    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function load(i, autoplay) {
    index = (i + tracks.length) % tracks.length;
    const t = tracks[index];
    audio.src = t.url;
    nameEl.textContent = t.name;
    artistEl.textContent = t.artist;
    highlight();
    if (autoplay) audio.play();
  }

  function setIcon(playing) {
    icon.querySelector('path').setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
  }

  document.getElementById('toggle').addEventListener('click', () => {
    if (!audio.src) { load(0, true); return; }
    if (audio.paused) audio.play(); else audio.pause();
  });
  document.getElementById('next').addEventListener('click', () => load(index + 1, true));
  document.getElementById('prev').addEventListener('click', () => load(index - 1, true));
  audio.addEventListener('play', () => setIcon(true));
  audio.addEventListener('pause', () => setIcon(false));
  audio.addEventListener('ended', () => load(index + 1, true));

  load(0, false);
</script>
