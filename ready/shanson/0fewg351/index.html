 "https://archive.org/download/chanson-vol3/%D0%98%D0%BD%D0%BD%D0%B0%20%D0%92%D0%B0%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20-%20%D0%AF%20%D0%94%D1%83%D1%88%D1%83%20%D0%A2%D0%B2%D0%BE%D1%8E%20%D0%9D%D0%B5%20%D0%9E%D1%82%D0%BF%D1%83%D1%81%D0%BA%D0%B0%D1%8E.mp3"}, {"name": "О хоккеистах", "artist": "Владимир Высоцкий", "url": "https://archive.org/download/at-vladimir-vysotsky-concerts-2/S2_05%20%D0%9E%20%D1%85%D0%BE%D0%BA%D0%BA%D0%B5%D0%B8%D1%81%D1%82%D0%B0%D1%85.mp3"}, {"name": "Дождь", "artist": "Иван Фомин", "url": "https://archive.org/download/y_373_201805/151.-.mp3"}, {"name": "Я Буду Твоей Всегда", "artist": "Ирина Зинковская", "url": "https://archive.org/download/chanson-vol3/%D0%98%D1%80%D0%B8%D0%BD%D0%B0%20%D0%97%D0%B8%D0%BD%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B0%D1%8F%20-%20%D0%AF%20%D0%91%D1%83%D0%B4%D1%83%20%D0%A2%D0%B2%D0%BE%D0%B5%D0%B9%20%D0%92%D1%81%D0%B5%D0%B3%D0%B4%D0%B0.mp3"}, {"name": "Всем Делам Моим На Суше Вопреки", "artist": "Неизвестен", "url": "https://archive.org/download/01_20260322_20260322_1425/13.%20%D0%92%D1%81%D0%B5%D0%BC%20%D0%94%D0%B5%D0%BB%D0%B0%D0%BC%20%D0%9C%D0%BE%D0%B8%D0%BC%20%D0%9D%D0%B0%20%D0%A1%D1%83%D1%88%D0%B5%20%D0%92%D0%BE%D0%BF%D1%80%D0%B5%D0%BA%D0%B8....mp3"}, {"name": "Возвращайся", "artist": "Волк", "url": "https://archive.org/download/y_373_201805/150.-.mp3"}];
  const audio = document.getElementById('audio');
  const drum = document.getElementById('drum');
  const cassette = document.getElementById('cassette');
  const still = document.getElementById('still');
  const stillCtx = still.getContext('2d');
  const progress = document.getElementById('progress');
  let seeking = false;
  const listEl = document.getElementById('list');
  const nameEl = document.getElementById('name');
  const artistEl = document.getElementById('artist');
  const icon = document.getElementById('icon');
  const PLAY_PATH = "M8 5v14l11-7z";
  const PAUSE_PATH = "M6 5h4v14H6zM14 5h4v14h-4z";
  const N = tracks.length;
  const ANGLE = 36;
  const RADIUS = 86;
  const STEP_PX = 54;
  const TAP_PX = 6;
  let index = 0;
  let offset = 0;
  let history = [];
  let drag = null;

  const mod = x => ((x % N) + N) % N;

  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    li.dataset.i = i;
    li.innerHTML = '<span class="t"></span><span class="a"></span>';
    li.querySelector('.t').textContent = t.name;
    li.querySelector('.a').textContent = t.artist;
    listEl.appendChild(li);
  });

  function render() {
    [...listEl.children].forEach((li, i) => {
      let d = mod(i - offset);
      if (d > N / 2) d -= N;
      const a = Math.abs(d);
      li.style.transform = `rotateX(${-d * ANGLE}deg) translateZ(${RADIUS}px)`;
      li.style.opacity = a > 2.6 ? 0 : Math.max(0, 1 - a * 0.38);
      li.classList.toggle('active', a < 0.5);
    });
  }

  function moveTo(i) {
    const cur = Math.round(offset);
    let delta = mod(i - cur);
    if (delta > N / 2) delta -= N;
    offset = cur + delta;
    render();
  }

  function setTrack(i, autoplay) {
    index = i;
    const t = tracks[i];
    audio.src = t.url;
    setProgress(0);
    nameEl.textContent = t.name;
    artistEl.textContent = t.artist;
    updateMediaSession();
    if (autoplay) audio.play();
  }

  function load(i, autoplay) {
    const t = mod(i);
    moveTo(t);
    setTrack(t, autoplay);
  }

  function play(i) {
    if (i === index) { audio.play(); return; }
    history.push(index);
    load(i, true);
  }

  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const t = tracks[index];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Песконечный плеер Шансона',
      artist: t.artist + ' — ' + t.name,
    });
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => document.getElementById('prev').click());
    navigator.mediaSession.setActionHandler('nexttrack', () => document.getElementById('next').click());
  }

  function randomIndex() {
    let i;
    do { i = Math.floor(Math.random() * N); } while (i === index);
    return i;
  }

  function setIcon(playing) {
    icon.querySelector('path').setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
  }

  drum.addEventListener('pointerdown', e => {
    drag = { y: e.clientY, start: offset, moved: false, id: e.pointerId };
  });

  drum.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) > TAP_PX) {
      drag.moved = true;
      drum.setPointerCapture(drag.id);
      drum.classList.add('dragging');
    }
    if (drag.moved) {
      offset = drag.start - dy / STEP_PX;
      render();
    }
  });

  function endDrag(e) {
    if (!drag) return;
    const was = drag;
    drag = null;
    if (!was.moved) {
      const li = document.elementFromPoint(e.clientX, e.clientY)?.closest('li');
      if (li) play(Number(li.dataset.i));
      return;
    }
    drum.classList.remove('dragging');
    void drum.offsetWidth;
    const target = mod(Math.round(offset));
    offset = Math.round(offset);
    render();
    if (target !== index) {
      history.push(index);
      setTrack(target, !audio.paused);
    }
  }

  drum.addEventListener('pointerup', endDrag);
  drum.addEventListener('pointercancel', endDrag);

  document.getElementById('toggle').addEventListener('click', () => {
    if (audio.paused) audio.play(); else audio.pause();
  });
  document.getElementById('next').addEventListener('click', () => play(randomIndex()));
  document.getElementById('prev').addEventListener('click', () => {
    if (history.length) load(history.pop(), true);
    else load(index - 1, true);
  });
  audio.addEventListener('play', () => {
    setIcon(true);
    still.classList.remove('show');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', () => {
    setIcon(false);
    freezeCassette();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });

  function freezeCassette() {
    if (!cassette.naturalWidth) return;
    still.width = cassette.naturalWidth;
    still.height = cassette.naturalHeight;
    stillCtx.drawImage(cassette, 0, 0);
    still.classList.add('show');
  }
  cassette.addEventListener('load', () => { if (audio.paused) freezeCassette(); });

  function setProgress(pct) {
    progress.value = pct * 1000;
    progress.style.setProperty('--p', (pct * 100) + '%');
  }
  audio.addEventListener('timeupdate', () => {
    if (seeking || !audio.duration) return;
    setProgress(audio.currentTime / audio.duration);
  });
  progress.addEventListener('input', () => {
    seeking = true;
    setProgress(progress.value / 1000);
  });
  progress.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = (progress.value / 1000) * audio.duration;
    seeking = false;
  });
  audio.addEventListener('ended', () => play(index + 1));

  document.getElementById('count').textContent = 'Треков: ' + N;
  load(0, false);
</script>
