<script>
  (() => {
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    const flakes = [];
    const COUNT = 28;
    const SYMBOLS = ['*', '.', '*', '·'];
    let w = 0, h = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn(initial) {
      return {
        x: Math.random() * w,
        y: initial ? Math.random() * h : -20,
        size: 10 + Math.random() * 12,
        speed: 0.4 + Math.random() * 0.8,
        sway: 0.3 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        char: SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
        alpha: 0.35 + Math.random() * 0.45,
      };
    }

    function init() {
      resize();
      flakes.length = 0;
      for (let i = 0; i < COUNT; i++) flakes.push(spawn(true));
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 16.67, 3);
      last = now;
      ctx.clearRect(0, 0, w, h);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const f of flakes) {
        f.y += f.speed * dt;
        f.phase += 0.01 * dt;
        const x = f.x + Math.sin(f.phase) * 18 * f.sway;
        ctx.globalAlpha = f.alpha;
        ctx.fillStyle = '#fff';
        ctx.font = `${f.size}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.fillText(f.char, x, f.y);
        if (f.y > h + 20) Object.assign(f, spawn(false));
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    init();
    requestAnimationFrame(frame);
  })();
</script>

    drag = null;
    if (!was.moved) {
      const li = document.elementFromPoint(e.clientX, e.clientY)?.closest('li');
      if (li) play(Number(li.dataset.i));
      return;
    }
    drum.classList.remove('dragging');
    void drum.offsetWidth;
    const target = mod(Math.round(offset));
    offset = Math.round(offset);
    render();
    if (target !== index) {
      history.push(index);
      setTrack(target, !audio.paused);
    }
  }

  drum.addEventListener('pointerup', endDrag);
  drum.addEventListener('pointercancel', endDrag);

  document.getElementById('toggle').addEventListener('click', () => {
    if (audio.paused) audio.play(); else audio.pause();
  });
  document.getElementById('next').addEventListener('click', () => play(nextIdx));
  document.getElementById('prev').addEventListener('click', () => {
    if (history.length) load(history.pop(), true);
    else load(index - 1, true);
  });
  audio.addEventListener('play', () => {
    setIcon(true);
    still.classList.remove('show');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', () => {
    setIcon(false);
    freezeCassette();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });

  function freezeCassette() {
    if (!cassette.naturalWidth) return;
    still.width = cassette.naturalWidth;
    still.height = cassette.naturalHeight;
    stillCtx.drawImage(cassette, 0, 0);
    still.classList.add('show');
  }
  cassette.addEventListener('load', () => { if (audio.paused) freezeCassette(); });

  function setProgress(pct) {
    progress.value = pct * 1000;
    progress.style.setProperty('--p', (pct * 100) + '%');
  }
  audio.addEventListener('timeupdate', () => {
    if (seeking || !audio.duration) return;
    setProgress(audio.currentTime / audio.duration);
  });
  progress.addEventListener('input', () => {
    seeking = true;
    setProgress(progress.value / 1000);
  });
  progress.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = (progress.value / 1000) * audio.duration;
    seeking = false;
  });
  audio.addEventListener('ended', () => play(nextIdx));

  const nowEl = document.getElementById('now');
  const promoEl = document.getElementById('promo');
  const promoText = document.getElementById('promoText');
  const PROMO_PHRASES = ['Заказать другие коллекции', 'Промокод: ТЕПЛО25', 'Скидка 25%', 'Нажми чтобы заказать'];
  const PROMO_EVERY = 45000, PROMO_STEP = 2500, PROMO_SWAP = 250;

  function swapPhrase(k) {
    promoText.classList.add('out');
    setTimeout(() => {
      promoText.textContent = PROMO_PHRASES[k];
      promoText.classList.remove('out');
    }, PROMO_SWAP);
  }

  function runPromo() {
    promoText.textContent = PROMO_PHRASES[0];
    nowEl.classList.add('promo-on');
    promoEl.classList.add('show');
    for (let k = 1; k < PROMO_PHRASES.length; k++) setTimeout(() => swapPhrase(k), PROMO_STEP * k);
    setTimeout(() => {
      promoEl.classList.remove('show');
      nowEl.classList.remove('promo-on');
    }, PROMO_STEP * PROMO_PHRASES.length);
  }
  setInterval(runPromo, PROMO_EVERY);

  load(0, false);
</script>
</body>
</html>
