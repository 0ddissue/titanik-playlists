<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script defer src="https://cloud.umami.is/script.js" data-website-id="9f81cbdc-96dc-4ce3-86f3-2131fbf2d56d"></script>
<title>Заказать микс песен</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: #fff; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 40px 20px 48px; }
  h1 { font-size: 24px; font-weight: 600; text-align: center; margin: 0 0 12px; line-height: 1.3; }
  .lead { font-size: 16px; color: #d1d1d6; text-align: center; margin: 0 0 22px; line-height: 1.5; }
  .socials { display: flex; justify-content: center; gap: 28px; margin-bottom: 30px; }
  .socials a {
    width: 64px; height: 64px; border-radius: 50%; display: block; overflow: hidden;
    transition: transform 0.2s ease;
  }
  .socials a:active { transform: scale(0.92); }
  .socials img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .more { font-size: 16px; color: #d1d1d6; text-align: center; margin: 0 0 16px; }
  .collections { display: flex; flex-direction: column; gap: 10px; }
  .collections button {
    width: 100%; display: flex; justify-content: center; align-items: center;
    padding: 14px 18px; border: none; border-radius: 12px; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); color: #fff; font: inherit; font-size: 16px; text-align: center;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .collections button:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.14); }
  .popup {
    position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(0, 0, 0, 0.7); opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, visibility 0s linear 0.25s;
  }
  .popup.show { opacity: 1; visibility: visible; transition: opacity 0.25s ease, visibility 0s; }
  .popup-box {
    width: 100%; max-width: 360px; padding: 24px 22px; border-radius: 16px;
    background: #1c1c1e; text-align: center; transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .popup.show .popup-box { transform: none; }
  .popup-title { font-size: 18px; font-weight: 600; margin: 0 0 14px; line-height: 1.3; }
  .popup-text { font-size: 15px; color: #d1d1d6; line-height: 1.5; margin: 0 0 12px; }
  .popup-pay {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; margin-top: 8px;
    border-radius: 12px; background: linear-gradient(180deg, #9929ea, #5808fb); color: #fff;
    font-size: 17px; font-weight: 600; text-decoration: none;
  }
  .popup-close {
    width: 100%; height: 44px; margin-top: 10px; border: none; border-radius: 12px; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); color: #fff; font: inherit; font-size: 16px;
  }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>Заказать микс песен на свой вкус</h1>
  <p class="lead">Напишите нам и соберем ваш личный плеер</p>

  <div class="socials">
    <a href="https://vk.me/titanikshop" target="_blank" rel="noopener noreferrer" aria-label="ВКонтакте" data-umami-event="Клик ВК">
      <img src="vk.png" alt="ВКонтакте">
    </a>
    <a href="https://t.me/titanikshop" target="_blank" rel="noopener noreferrer" aria-label="Telegram" data-umami-event="Клик Telegram">
      <img src="telegram.png" alt="Telegram">
    </a>
  </div>

  <p class="more">или заберите готовые коллекции:</p>
  <div class="collections">
    <button type="button"><span>Русская дискотека</span></button>
    <button type="button"><span>Зарубежная вечеринка</span></button>
    <button type="button"><span>Классика рок музыки</span></button>
    <button type="button"><span>Драйвовая дорожная</span></button>
    <button type="button"><span>Шедевры классической музыки</span></button>
    <button type="button"><span>Великолепный джаз</span></button>
  </div>
</div>

<div class="popup" id="popup" aria-hidden="true">
  <div class="popup-box">
    <p class="popup-title" id="popupTitle"></p>
    <p class="popup-text">Размер оплаты — на ваше усмотрение, но мы были бы благодарны сумме от 100 руб.</p>
    <p class="popup-text">После оплаты пришлите нам чек, чтобы активировать новый плейлист.</p>
    <a class="popup-pay" href="https://finance.ozon.ru/apps/sbp/ozonbankpay/01a214c6-c3a9-755a-89a2-f50ed8fbccd5" target="_blank" rel="noopener noreferrer" data-umami-event="Оплата">Оплатить</a>
    <button type="button" class="popup-close" id="popupClose">Закрыть</button>
  </div>
</div>

<script>
  (() => {
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popupTitle');
    const close = () => { popup.classList.remove('show'); popup.setAttribute('aria-hidden', 'true'); };
    document.querySelectorAll('.collections button').forEach(btn => {
      btn.addEventListener('click', () => {
        popupTitle.textContent = btn.textContent;
        popup.classList.add('show');
        popup.setAttribute('aria-hidden', 'false');
      });
    });
    document.getElementById('popupClose').addEventListener('click', close);
    popup.addEventListener('click', e => { if (e.target === popup) close(); });
  })();
</script>

<script>
  (() => {
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    const flakes = [];
    const COUNT = 28;
    const SYMBOLS = ['*', '.', '*', '·'];
    let w = 0, h = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn(initial) {
      return {
        x: Math.random() * w,
        y: initial ? Math.random() * h : -20,
        size: 10 + Math.random() * 12,
        speed: 0.4 + Math.random() * 0.8,
        sway: 0.3 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        char: SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
        alpha: 0.35 + Math.random() * 0.45,
      };
    }

    resize();
    for (let i = 0; i < COUNT; i++) flakes.push(spawn(true));

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 16.67, 3);
      last = now;
      ctx.clearRect(0, 0, w, h);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      for (const f of flakes) {
        f.y += f.speed * dt;
        f.phase += 0.01 * dt;
        const x = f.x + Math.sin(f.phase) * 18 * f.sway;
        ctx.globalAlpha = f.alpha;
        ctx.font = `${f.size}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.fillText(f.char, x, f.y);
        if (f.y > h + 20) Object.assign(f, spawn(false));
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
